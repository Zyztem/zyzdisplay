name: ZyzNotify APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android/zyznotify/**"
      - ".github/workflows/zyznotify.yml"
  pull_request:
    paths:
      - "android/zyznotify/**"
      - ".github/workflows/zyznotify.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/zyznotify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zyznotify-debug
          path: android/zyznotify/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
