<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>ZyzDisplay</title>
  <link rel="stylesheet" href="/dashboard.css?v=20260922a">
</head>
<body>
  <div id="ambient" aria-hidden="true">
    <img id="wallpaper-a" class="wallpaper-layer" alt="" decoding="async">
    <img id="wallpaper-b" class="wallpaper-layer" alt="" decoding="async">
    <div class="shade"></div>
    <div class="gradient"></div>
  </div>

  <main class="shell">
    <section id="hazard" class="hazard hidden">
      <div id="hazard-event" class="hazard-event"></div>
      <div id="hazard-copy" class="hazard-copy"></div>
    </section>
    <header class="header">
      <div class="header-left">
        <section class="timestamp">
          <svg class="icon timestamp-icon" viewBox="0 0 512 512" aria-hidden="true"><path fill="currentColor" d="M256 512A256 256 0 1 0 256 0a256 256 0 1 0 0 512zM232 128c0-13.3 10.7-24 24-24s24 10.7 24 24V245.5l75 43.7c11.5 6.7 15.4 21.4 8.7 32.8s-21.4 15.4-32.8 8.7l-86.9-50.6c-7.4-4.3-12-12.2-12-20.7V128z"></path></svg>
          <div class="timestamp-copy">
            <div id="clock" class="clock"><span id="clock-time">12:00</span><span id="clock-ampm">PM</span></div>
            <div id="date" class="date">Thursday, August 13</div>
            <div id="greeting" class="greeting">Good evening</div>
          </div>
        </section>

        <section id="agenda" class="agenda-card glass hidden">
          <div class="agenda-kicker">Today</div>
          <div id="agenda-items"></div>
        </section>
      </div>

      <div class="weather-col">
        <section id="spotify-widget" class="spotify-widget glass hidden">
          <div class="spotify-widget-now">
            <div class="spotify-widget-art">
              <img id="spotify-image-a" class="album-layer" alt="" decoding="async">
              <img id="spotify-image-b" class="album-layer" alt="" decoding="async">
              <div id="spotify-placeholder" class="album-placeholder">
                <svg class="spotify-mark" viewBox="0 0 496 512" aria-hidden="true"><path fill="currentColor" d="M248 8C111.1 8 0 119.1 0 256s111.1 248 248 248 248-111.1 248-248S384.9 8 248 8zm100.7 364.9c-4.2 0-6.8-1.3-10.7-3.6-62.4-37.6-135-39.2-206.7-24.5-3.9 1-9 2.6-11.9 2.6-9.7 0-15.8-7.7-15.8-15.8 0-10.3 6.1-15.2 13.6-16.8 81.9-18.1 165.6-16.5 237 26.2 6.1 3.9 9.7 7.4 9.7 16.5s-7.1 15.4-15.2 15.4zm26.9-65.6c-5.2 0-8.7-2.3-12.3-4.2-62.5-37-155.7-51.9-238.6-29.4-4.8 1.3-7.4 2.6-11.9 2.6-10.7 0-19.4-8.7-19.4-19.4s5.2-17.8 15.5-20.7c27.8-7.8 56.2-13.6 97.8-13.6 64.9 0 127.6 16.1 177 45.5 8.1 4.8 11.3 11 11.3 19.7-.1 10.8-8.5 19.5-19.4 19.5zm31-76.2c-5.2 0-8.4-1.3-12.9-3.9-71.2-42.5-198.5-52.7-280.9-29.7-3.6 1-8.1 2.6-12.9 2.6-13.2 0-23.3-10.3-23.3-23.6 0-13.6 8.4-21.3 17.4-23.9 35.2-10.3 74.6-15.2 117.5-15.2 73 0 149.5 15.2 205.4 47.8 7.8 4.5 12.9 10.7 12.9 22.6 0 13.6-11 23.3-23.2 23.3z"></path></svg>
              </div>
            </div>
            <div class="spotify-widget-copy">
              <div class="spotify-widget-kicker">
                <span class="spotify-status">
                  <span id="spotify-eq" class="eq" aria-hidden="true"><i></i><i></i><i></i></span>
                  <svg id="spotify-state-icon" class="icon" viewBox="0 0 384 512" aria-hidden="true"><path fill="currentColor" d="M73 39c-14.8-9.1-33.4-9.4-48.5-.9S0 62.6 0 80V432c0 17.4 9.4 33.4 24.5 41.9s33.7 8.1 48.5-.9L361 297c14.3-8.7 23-24.2 23-41s-8.7-32.2-23-41L73 39z"></path></svg>
                  <span id="spotify-state-label">Now Playing</span>
                </span>
              </div>
              <div class="spotify-title-wrap"><span id="spotify-title">Song title</span></div>
              <div id="spotify-artist" class="spotify-widget-artist">Artist</div>
            </div>
          </div>
          <div class="progress-area">
            <div class="progress-track"><div id="spotify-progress" class="progress-fill"></div></div>
            <div class="progress-labels">
              <span id="spotify-position">0:00</span>
              <span id="spotify-duration">0:00</span>
            </div>
          </div>
        </section>

        <section id="weather-card" class="weather-card glass">
          <div class="weather-now">
            <svg id="weather-icon" class="icon weather-glyph" viewBox="0 0 512 512" aria-hidden="true"><path fill="currentColor" d="M361.5 1.2c5 2.1 8.6 6.6 9.6 11.9L391 121l107.9 19.8c5.3 1 9.8 4.6 11.9 9.6s1.5 10.7-1.6 15.2L446.9 256l62.3 90.3c3.1 4.5 3.7 10.2 1.6 15.2s-6.6 8.6-11.9 9.6L391 391 371.1 498.9c-1 5.3-4.6 9.8-9.6 11.9s-10.7 1.5-15.2-1.6L256 446.9l-90.3 62.3c-4.5 3.1-10.2 3.7-15.2 1.6s-8.6-6.6-9.6-11.9L121 391 13.1 371.1c-5.3-1-9.8-4.6-11.9-9.6s-1.5-10.7 1.6-15.2L65.1 256 2.8 165.7c-3.1-4.5-3.7-10.2-1.6-15.2s6.6-8.6 11.9-9.6L121 121 140.9 13.1c1-5.3 4.6-9.8 9.6-11.9s10.7-1.5 15.2 1.6L256 65.1 346.3 2.8c4.5-3.1 10.2-3.7 15.2-1.6zM160 256a96 96 0 1 1 192 0 96 96 0 1 1 -192 0zm224 0a128 128 0 1 0 -256 0 128 128 0 1 0 256 0z"></path></svg>
            <div class="weather-copy">
              <div id="weather-place" class="weather-place">Newberry</div>
              <div class="weather-line">
                <span id="weather-temp">--</span><span class="weather-deg">°</span>
              </div>
              <div id="weather-desc" class="weather-desc"></div>
              <div class="weather-range-row">
                <span id="weather-range"></span>
                <span id="weather-feels"></span>
              </div>
            </div>
          </div>
          <div id="weather-alert" class="weather-alert"></div>
          <div id="hourly" class="hourly"></div>
          <div id="weather-stats" class="weather-stats">
            <div class="weather-stat">
              <span class="weather-stat-label">Humidity</span>
              <span id="weather-humidity"></span>
            </div>
            <div class="weather-stat">
              <span class="weather-stat-label">Wind</span>
              <span id="weather-wind"></span>
            </div>
            <div id="weather-uv-stat" class="weather-stat hidden">
              <span class="weather-stat-label">UV</span>
              <span id="weather-uv"></span>
            </div>
            <div id="weather-aqi-stat" class="weather-stat hidden">
              <span class="weather-stat-label">AQI</span>
              <span id="weather-aqi"></span>
            </div>
          </div>
          <div id="forecast" class="forecast"></div>
          <div id="weather-extras" class="weather-extras"></div>
        </section>
      </div>

      <div class="brand">
        <svg class="icon" viewBox="0 0 640 512" aria-hidden="true"><path fill="currentColor" d="M64 64V352H576V64H64zM0 64C0 28.7 28.7 0 64 0H576c35.3 0 64 28.7 64 64V352c0 35.3-28.7 64-64 64H64c-35.3 0-64-28.7-64-64V64zM128 448H512c17.7 0 32 14.3 32 32s-14.3 32-32 32H128c-17.7 0-32-14.3-32-32s14.3-32 32-32z"></path></svg>
        <span>ZyzDisplay</span>
      </div>
    </header>

    <footer class="footer glass">
      <div class="ready-row">
        <span data-service="miracast">
          <svg class="icon" viewBox="0 0 640 512" aria-hidden="true"><path fill="currentColor" d="M64 64V352H576V64H64zM0 64C0 28.7 28.7 0 64 0H576c35.3 0 64 28.7 64 64V352c0 35.3-28.7 64-64 64H64c-35.3 0-64-28.7-64-64V64zM128 448H512c17.7 0 32 14.3 32 32s-14.3 32-32 32H128c-17.7 0-32-14.3-32-32s14.3-32 32-32z"></path></svg>
          Miracast
          <b class="status-dot" aria-hidden="true"></b>
        </span>
        <span data-service="airplay">
          <svg class="icon" viewBox="0 0 576 512" aria-hidden="true"><path fill="currentColor" d="M512 32H64C28.7 32 0 60.7 0 96V320c0 35.3 28.7 64 64 64h85.3L192 329.4c12.4-16.5 32-26.2 52.8-26.2h86.5c20.8 0 40.4 9.7 52.8 26.2L426.7 384H512c35.3 0 64-28.7 64-64V96c0-35.3-28.7-64-64-64zM288 352L160 496h256L288 352z"></path></svg>
          AirPlay
          <b class="status-dot" aria-hidden="true"></b>
        </span>
        <span data-service="spotify">
          <svg class="icon" viewBox="0 0 496 512" aria-hidden="true"><path fill="currentColor" d="M248 8C111.1 8 0 119.1 0 256s111.1 248 248 248 248-111.1 248-248S384.9 8 248 8zm100.7 364.9c-4.2 0-6.8-1.3-10.7-3.6-62.4-37.6-135-39.2-206.7-24.5-3.9 1-9 2.6-11.9 2.6-9.7 0-15.8-7.7-15.8-15.8 0-10.3 6.1-15.2 13.6-16.8 81.9-18.1 165.6-16.5 237 26.2 6.1 3.9 9.7 7.4 9.7 16.5s-7.1 15.4-15.2 15.4zm26.9-65.6c-5.2 0-8.7-2.3-12.3-4.2-62.5-37-155.7-51.9-238.6-29.4-4.8 1.3-7.4 2.6-11.9 2.6-10.7 0-19.4-8.7-19.4-19.4s5.2-17.8 15.5-20.7c27.8-7.8 56.2-13.6 97.8-13.6 64.9 0 127.6 16.1 177 45.5 8.1 4.8 11.3 11 11.3 19.7-.1 10.8-8.5 19.5-19.4 19.5zm31-76.2c-5.2 0-8.4-1.3-12.9-3.9-71.2-42.5-198.5-52.7-280.9-29.7-3.6 1-8.1 2.6-12.9 2.6-13.2 0-23.3-10.3-23.3-23.6 0-13.6 8.4-21.3 17.4-23.9 35.2-10.3 74.6-15.2 117.5-15.2 73 0 149.5 15.2 205.4 47.8 7.8 4.5 12.9 10.7 12.9 22.6 0 13.6-11 23.3-23.2 23.3z"></path></svg>
          Spotify
          <b class="status-dot" aria-hidden="true"></b>
        </span>
        <span data-service="bluetooth">
          <svg class="icon" viewBox="0 0 448 512" aria-hidden="true"><path fill="currentColor" d="M416 259.4C416 465 344.1 512 230.9 512S32 465 32 259.4 115.4 0 228.6 0 416 53.9 416 259.4zm-158.5 0l79.4-88.6L211.8 36.5v176.9L138 139.6l-27 26.9 92.7 93-92.7 93 26.9 26.9 73.8-73.8 2.3 170 127.4-127.5-83.9-88.7z"></path></svg>
          <span id="bluetooth-label">Bluetooth</span>
          <b class="status-dot" aria-hidden="true"></b>
        </span>
        <span data-service="disc">
          <svg class="icon" viewBox="0 0 512 512" aria-hidden="true"><path fill="currentColor" d="M256 0a256 256 0 1 1 0 512A256 256 0 1 1 256 0zM232 120v16c0 13.3 10.7 24 24 24s24-10.7 24-24V120c0-13.3-10.7-24-24-24s-24 10.7-24 24zM96 256a160 160 0 1 0 320 0A160 160 0 1 0 96 256zm160-80a80 80 0 1 1 0 160 80 80 0 1 1 0-160z"></path></svg>
          Disc
          <b class="status-dot" aria-hidden="true"></b>
        </span>
      </div>
      <div id="wallpaper-credit" class="wallpaper-credit"></div>
      <div class="network">
        <svg class="icon network-glyph" viewBox="0 0 640 512" aria-hidden="true"><path fill="currentColor" d="M54.2 202.9C123.2 136.7 216.8 96 320 96s196.8 40.7 265.8 106.9c12.8 12.2 33 11.8 45.2-.9s11.8-33-.9-45.2C549.7 79.5 440.4 32 320 32S90.3 79.5 9.8 156.7C-2.9 169-3.3 189.2 8.9 202s32.5 13.2 45.2 .9zM320 256c56.8 0 108.6 21.1 148.2 56c13.3 11.7 33.5 10.4 45.2-2.8s10.4-33.5-2.8-45.2C459.8 219.2 393 192 320 192s-139.8 27.2-190.5 72c-13.3 11.7-14.5 31.9-2.8 45.2s31.9 14.5 45.2 2.8c39.5-34.9 91.3-56 148.2-56zm64 160a64 64 0 1 0 -128 0 64 64 0 1 0 128 0z"></path></svg>
        <div class="network-copy">
          <div id="network-ssid" class="network-ssid">Checking network...</div>
          <div id="network-ip" class="network-ip"></div>
        </div>
      </div>
    </footer>
  </main>

  <script src="/dashboard.js?v=20260922a"></script>
</body>
</html>
